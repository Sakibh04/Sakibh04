name: Update profile cards

on:
  schedule:
    - cron: "17 3 * * *" # daily, ~3am Irish time
  workflow_dispatch: # "Run workflow" button in the Actions tab
  push:
    paths:
      - ".github/workflows/profile-cards.yml" # runs once as soon as you commit this file

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

env:
  # One place to restyle every stats/pin card: GitHub-dark background + Swift orange accent
  CARD_STYLE: "bg_color=0D1117&title_color=FA7343&icon_color=FA7343&ring_color=FA7343&text_color=C9D1D9&hide_border=true&border_radius=10"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&${{ env.CARD_STYLE }}"
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          # Notebooks are counted by raw JSON size, which swamps every other language
          options: "username=${{ github.repository_owner }}&layout=compact&langs_count=8&hide=jupyter%20notebook&${{ env.CARD_STYLE }}"
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Streak card
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: "user=${{ github.repository_owner }}&hide_border=true&background=0D1117&stroke=30363D&ring=FA7343&fire=FA7343&currStreakLabel=FA7343&currStreakNum=E6EDF3&sideNums=E6EDF3&sideLabels=8B949E&dates=8B949E"
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/snake.svg?color_snake=#FA7343
            profile/snake-dark.svg?palette=github-dark&color_snake=#FA7343
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/
          git diff --staged --quiet && { echo "No changes"; exit 0; }
          git commit -m "chore: refresh profile cards"
          git pull --rebase
          git push
